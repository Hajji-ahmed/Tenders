[project]
name = "tender-ai-backend"
version = "0.1.0"
description = "Backend FastAPI de la plateforme IA de gestion des appels d'offres"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "email-validator>=2.2",
  "sqlalchemy>=2.0.32",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pgvector>=0.3",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "boto3>=1.35",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
  "slowapi>=0.1.9",
  "structlog>=24.4",
  "sentry-sdk[fastapi]>=2.0",
  "httpx>=0.27",
  "tenacity>=9.0",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "feedparser>=6.0",
  "python-multipart>=0.0.9",
  "filetype>=1.2",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "openai>=1.40",
  "tavily-python>=0.5",
  "playwright>=1.46",
  "rapidfuzz>=3.9",
  "python-dateutil>=2.9",
  "pycountry>=24.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "freezegun>=1.5",
  "factory-boy>=3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]   # fichiers générés par Alembic

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Form", "fastapi.File"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]         # ne pas confondre avec le dossier local alembic/

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
