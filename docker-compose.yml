# Environnement de développement local. Les ports sont liés à 127.0.0.1 : rien n'est exposé
# sur le réseau (Wi-Fi partagé, VPS). Les mots de passe viennent de .env (voir .env.example).

x-backend: &backend
  build:
    context: ./backend
    dockerfile: ../infrastructure/docker/backend.Dockerfile
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tender}:${POSTGRES_PASSWORD:-tender}@postgres:5432/${POSTGRES_DB:-tender}
    REDIS_URL: redis://redis:6379/0
    STORAGE_ENDPOINT: http://minio:9000
    STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
    STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio12345}
  volumes:
    - ./backend:/app
    - backend-venv:/app/.venv

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tender}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tender}
      POSTGRES_DB: ${POSTGRES_DB:-tender}
    # Port hôte 5433 : un PostgreSQL natif Windows occupe souvent le 5432.
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tender}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minio} ${MINIO_ROOT_PASSWORD:-minio12345} &&
      mc mb -p local/${STORAGE_BUCKET:-tender-ai} || true"

  api:
    <<: *backend
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --proxy-headers --forwarded-allow-ips=*

  worker:
    <<: *backend
    depends_on: [api]
    command: celery -A app.workers.celery_app:celery_app worker -l info --concurrency=2

  beat:
    <<: *backend
    depends_on: [worker]
    command: celery -A app.workers.celery_app:celery_app beat -l info --schedule /tmp/celerybeat-schedule

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/frontend.Dockerfile
      args:
        API_URL: http://api:8000   # figé au build (rewrites Next.js)
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  miniodata:
  backend-venv:
