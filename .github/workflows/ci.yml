name: CI

on:
  push:
    branches: [main, develop, hajji, "feature/**"]
  pull_request:

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tender
          POSTGRES_PASSWORD: tender
          POSTGRES_DB: tender_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tender"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      APP_ENV: test
      SECRET_KEY: ci-secret-key-ci-secret-key-0123456789
      DATABASE_URL: postgresql+psycopg://tender:tender@localhost:5432/tender_test
      REDIS_URL: redis://localhost:6379/0
      STORAGE_BACKEND: local
      CELERY_TASK_ALWAYS_EAGER: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Enable pgvector
        run: psql postgresql://tender:tender@localhost:5432/tender_test -c "CREATE EXTENSION IF NOT EXISTS vector"
      - run: uv run pytest -q --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
